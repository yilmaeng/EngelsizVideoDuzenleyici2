name: Build Instant Voice Translation Windows

on:
  workflow_dispatch:
  push:
    branches:
      - instant-voice-translation-cross-platform

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install dependencies
        run: npm ci

      - name: Build Windows package
        run: npm run build:instant-voice-translation

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: anlik-sesli-ceviri-windows-x64
          path: dist/
          if-no-files-found: error
